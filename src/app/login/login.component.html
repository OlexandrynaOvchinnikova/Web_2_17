<div class="flex justify-center items-center min-h-screen bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full sm:w-96">
    <h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">Увійти</h2>

    <form (ngSubmit)="login()" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-600">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          required
          class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:outline-none"
          placeholder="Введіть ваш email"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-600">Пароль</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          required
          class="w-full px-4 py-2 mt-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:outline-none"
          placeholder="Введіть ваш пароль"
        />
      </div>

      <button
        type="submit"
        class="w-full py-2 mt-4 bg-blue-500 text-white rounded-md shadow-md hover:bg-blue-600 transition duration-300"
      >
        Увійти
      </button>

      <div *ngIf="errorMessage" class="mt-4 text-red-500 text-center">
        {{ errorMessage }}
      </div>
    </form>

    <div class="mt-4 text-center text-sm">
      <p>Ще не маєте акаунту? <a href="/registration" class="text-blue-500">Зареєструйтесь</a></p>
    </div>
  </div>
</div>
