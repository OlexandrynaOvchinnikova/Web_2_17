<form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow-lg space-y-6">
  <div class="mb-4">
    <label for="name" class="block text-sm font-medium text-gray-700">Name:</label>
    <input
      type="text"
      id="name"
      formControlName="name"
      class="border border-gray-300 p-3 w-full rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
    <div *ngIf="registrationForm.get('name')?.invalid && registrationForm.get('name')?.touched" class="text-red-500 text-sm mt-2">
      <p *ngIf="registrationForm.get('name')?.errors?.['required']">Name is required.</p>
      <p *ngIf="registrationForm.get('name')?.errors?.['minlength']">Minimum 3 characters required.</p>
    </div>
  </div>

  <div class="mb-4">
    <label for="email" class="block text-sm font-medium text-gray-700">Email:</label>
    <input
      type="email"
      id="email"
      formControlName="email"
      class="border border-gray-300 p-3 w-full rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
    <div *ngIf="registrationForm.get('email')?.invalid && registrationForm.get('email')?.touched" class="text-red-500 text-sm mt-2">
      <p *ngIf="registrationForm.get('email')?.errors?.['required']">Email is required.</p>
      <p *ngIf="registrationForm.get('email')?.errors?.['email']">Invalid email format.</p>
    </div>
  </div>

  <div class="mb-4">
    <label for="password" class="block text-sm font-medium text-gray-700">Password:</label>
    <input
      type="password"
      id="password"
      formControlName="password"
      class="border border-gray-300 p-3 w-full rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
    <div *ngIf="registrationForm.get('password')?.invalid && registrationForm.get('password')?.touched" class="text-red-500 text-sm mt-2">
      <p *ngIf="registrationForm.get('password')?.errors?.['required']">Password is required.</p>
      <p *ngIf="registrationForm.get('password')?.errors?.['minlength']">Minimum 6 characters required.</p>
    </div>
  </div>

  <button
    type="submit"
    class="w-full py-3 bg-blue-500 text-white font-semibold rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300"
    [disabled]="registrationForm.invalid"
  >
    Submit
  </button>
</form>
